# The push check of AGENTS.md on GitHub: a push happens only when no item of docs/plans/execution-checklist.md is in
# progress. The pre-push hook .githooks/pre-push, which make hooks of kit writes, refuses such a push in a checkout where
# make has set core.hooksPath; this job checks the pushed tip commit of every push, the head commit of every pull request,
# not a merge commit, and every merge group of the merge queue, the commit that main receives, with make
# push-gate-commit of kit, also when a push did not run the hook. The branches of the merge queue run it as merge groups,
# so their pushes are ignored.
# Earlier commits of a push are not read: an item is recorded in progress in one commit and completed in a later one. It
# fails naming each item in progress as an error annotation and in the job summary, and when the commit does not track
# the hook with mode 100755. make check-records reads the messages of the commits of RANGE, the commits that the event
# brings: the commits of a push after the tip it replaced (after the default branch for a new branch), of a pull request
# after its base and of a merge group after its base. The checkout holds the whole history, so the range resolves.
name: push-gate

on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  push-gate:
    # The actions are pinned to commits.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # The Node.js of mise.toml starts the bootstrap, which installs that release into var/tools; the tools of kit
      # run the node of var/tools, and the npm of packageManager installs the packages, so the cache of setup-node is off.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      # make toolchain-check of ci-push reads the tools of mise.lock and the Rust toolchain of rust-toolchain.toml, both of
      # which make install-tools installs.
      - name: install tools
        run: make install-tools
      - name: declared tools, no checklist item in progress, the records and the TypeScript
        run: make ci-push
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
            && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || github.event_name == 'merge_group'
            && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha)
            || github.event.created
            && format('origin/{0}..{1}', github.event.repository.default_branch, github.sha)
            || format('{0}..{1}', github.event.before, github.sha) }}
      - name: upload the logs and the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: push-gate
          path: var/report/ci-targets/
          if-no-files-found: error
