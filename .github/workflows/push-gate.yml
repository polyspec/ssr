# The push check of AGENTS.md on GitHub: a push happens only when no item of docs/checklist.md is
# in progress. The pre-push hook .githooks/pre-push refuses such a push in a checkout where make has
# set core.hooksPath; this job checks the pushed tip commit of every push and the head commit of
# every pull request, not a merge commit, with the same tool, also when a push did not run the hook.
# Earlier commits of a push are not read: an item is recorded in progress in one commit and
# completed in a later one. It fails naming each item in progress as an error annotation and in the
# job summary, and when the commit does not track the hook with mode 100755.
name: push-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  push-gate:
    # actions/setup-python provides Python 3.9 for Ubuntu 24.04, not for 26.04; the tools pin the
    # minor version 3.9 (tools/tool-versions.json). The actions are pinned to commits.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9"
      - name: declared Python and no checklist item in progress
        run: make ci-push
      - name: upload the logs and the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: push-gate
          path: var/ci/
          if-no-files-found: error
