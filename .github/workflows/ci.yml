# Build and test ssr on Linux. Each job runs only make targets: ci-setup prepares the runner and
# ci runs every CI target past failures (tools/ci_run.py). The per-target logs and the summary with
# the first failure lines are uploaded, and the summary is the job summary, also after a failure.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.8.1"
      - name: prepare the runner
        run: make ci-setup
      - name: build and test
        run: make ci
      - name: upload the logs and the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ matrix.runner }}
          path: var/ci/
          if-no-files-found: error
