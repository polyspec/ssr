[workspace]
members = [
    "crates/ssr-core",
    "crates/ssr-build",
    "crates/ssr-runtime",
    "crates/ssr-adapter-react",
    "crates/ssr-adapter-vue",
    "crates/ssr-adapter-svelte",
    "crates/ssr-adapter-vanilla",
    "crates/ssr-server",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
license = "MIT"

[workspace.dependencies]
ordered-json = { path = "/Users/maxkwon/ordered-json/rust", version = "=0.0.1" }
rolldown = "=1.2.11"
rolldown_common = "=1.2.11"
rolldown_plugin_utils = "=1.2.11"
rolldown_sourcemap = "=1.2.11"
lightningcss = { version = "=1.0.0-alpha.72", path = "/Users/maxkwon/soksakim-project/lightningcss-local", default-features = false, features = ["bundler"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
sha2 = "=0.11.0"
deno_core = "=0.412.0"
v8 = { version = "=150.4.0", features = ["v8_enable_pointer_compression"] }
crossbeam-channel = "=0.5.15"
getrandom = "=0.4.3"
wait-timeout = "=0.2.1"
http = "=1.3.1"
sourcemap = "=9.3.2"
tracing = "=0.1.44"
notify = "=8.2.0"
lol_html = "=3.0.1"

[patch.crates-io]
v8 = { path = "/Users/maxkwon/soksakim-project/v8-local" }
