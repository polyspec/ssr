[workspace]
members = [
    "crates/polyspec-ssr-core",
    "crates/polyspec-ssr-build",
    "crates/polyspec-ssr-runtime",
    "crates/polyspec-ssr-adapter-react",
    "crates/polyspec-ssr-adapter-vue",
    "crates/polyspec-ssr-adapter-svelte",
    "crates/polyspec-ssr-adapter-vanilla",
    "crates/polyspec-ssr-nonce",
    "crates/polyspec-ssr-server",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
license = "MIT"

[workspace.dependencies]
ordered-json = { package = "polyspec-ordered-json", git = "https://github.com/polyspec/ordered-json", version = "=0.0.1" }
rolldown = "=1.2.11"
rolldown_common = "=1.2.11"
rolldown_plugin_utils = "=1.2.11"
rolldown_sourcemap = "=1.2.11"
lightningcss = { git = "https://github.com/min-median-max/lightningcss", rev = "ddead301c67909b522ca0b996ec37c90cd68ca56", version = "=1.0.0-alpha.72", default-features = false, features = ["bundler"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "io-std", "sync", "net"] }
sha2 = "=0.11.0"
deno_core = "=0.412.0"
v8 = "=150.4.0"
crossbeam-channel = "=0.5.15"
getrandom = "=0.4.3"
wait-timeout = "=0.2.1"
rustix = { version = "=1.1.5", default-features = false, features = ["time"] }
http = "=1.3.1"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.17", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.3"
sourcemap = "=9.3.2"
tracing = "=0.1.44"
notify = "=8.2.0"
kqueue = "=1.2.1"
lol_html = "=3.0.1"

