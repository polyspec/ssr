# The tools that mise installs into var/tools/mise: `make toolchain-lock` writes their digests into mise.lock and
# `make install-tools` installs them with `mise install --locked`. go and python are at the pins of kit.
[tools]
"github:asamarts/alint" = "0.18.2"
# cargo-audit, which make dependency-review runs on every Cargo.lock for its advisories.
"github:rustsec/rustsec" = { version = "0.22.2", version_prefix = "cargo-audit/v" }
# cargo-nextest, which runs the tests of the packages (make check-nextest and the owner targets nextest-<package>).
"github:nextest-rs/nextest" = { version = "0.9.146", version_prefix = "cargo-nextest-" }
# cargo-deny, which checks the bans, licenses and sources of the locks (make check-deny) and their advisories.
cargo-deny = "0.20.2"
