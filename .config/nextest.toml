# Setup scripts are an experimental feature of the pinned cargo-nextest 0.9.146.
experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }
status-level = "all"
final-status-level = "all"

# A browser case builds the application, starts a browser and waits for page events, which
# normally takes about 18 s. Its slow-timeout reports the case every 60 s and stops a hung
# case after 30 minutes, about one hundred times its normal duration. The case prints each
# browser step with its elapsed time.
[[profile.default.overrides]]
filter = 'test(/^browser_/)'
slow-timeout = { period = "60s", terminate-after = 30 }
success-output = "final"
failure-output = "immediate-final"

# The ssr-server tests run the development_process and socket_process examples. Cargo builds
# examples only when no target is selected, so before any test of ssr-server this script builds
# both and names them in SSR_DEVELOPMENT_PROCESS and SSR_SOCKET_PROCESS (tools/build_programs.py).
# The build reports itself every 60 s and has no time limit.
[scripts.setup.build-programs]
command = ["python3", "-m", "tools.build_programs"]
slow-timeout = { period = "60s" }

[[profile.default.scripts]]
filter = 'package(ssr-server)'
setup = "build-programs"
