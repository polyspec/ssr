# Setup scripts are an experimental feature of the pinned cargo-nextest 0.9.146.
experimental = ["setup-scripts"]

# A case's limit only ends a hung case, far above the time a case takes; it is not a performance
# criterion. nextest reports such a case as TIMEOUT, which tools/cargo_case.py names hung.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }
status-level = "all"
final-status-level = "all"

# A browser case builds the application, starts a browser and waits for page events, which
# normally takes about 18 s. Its slow-timeout reports the case every 60 s and stops a hung
# case after 30 minutes, about one hundred times its normal duration. The case prints each
# browser step with its elapsed time.
[[profile.default.overrides]]
filter = 'test(/^browser_/)'
slow-timeout = { period = "60s", terminate-after = 30 }
success-output = "final"
failure-output = "immediate-final"

# The ssr-server tests run the development_process and socket_process examples. Cargo builds
# examples only when no target is selected, so before any test of ssr-server this script builds
# both and names them in SSR_DEVELOPMENT_PROCESS and SSR_SOCKET_PROCESS (tools/build_programs.py).
# The build reports itself every 60 s and has no time limit.
[scripts.setup.build-programs]
command = ["python3", "-m", "tools.build_programs"]
slow-timeout = { period = "60s" }

[[profile.default.scripts]]
filter = 'package(ssr-server)'
setup = "build-programs"

# Every test builds with the packages of tools/build-probe/tests/fixtures. Before the tests, this
# script installs them once per lock into the immutable var/packages/<digest> and names it in
# SSR_PACKAGES, and names the fixture sources in SSR_FIXTURES (tools/install_packages.py); each
# test copies the sources into a temporary root of its own. The install has no time limit. The
# filter names exactly the test binaries that read the installation, which tools/check.py checks
# (filter_errors of tools/install_packages.py), so tests that need no packages, such as the
# ssr-server targets of make check-linux, run without npm.
[scripts.setup.install-packages]
command = ["python3", "-m", "tools.install_packages"]
slow-timeout = { period = "60s" }

[[profile.default.scripts]]
filter = 'binary_id(=ssr-adapter-react::form_rows) | binary_id(=ssr-adapter-react::heap) | binary_id(=ssr-adapter-react::react) | binary_id(=ssr-adapter-react::recovery) | binary_id(=ssr-adapter-svelte::svelte) | binary_id(=ssr-adapter-vanilla::vanilla) | binary_id(=ssr-adapter-vue::vue) | binary_id(=ssr-build) | binary_id(=ssr-build::build) | binary_id(=ssr-build::files) | binary_id(=ssr-build::process) | binary_id(=ssr-build::public) | binary_id(=ssr-build::svelte) | binary_id(=ssr-runtime) | binary_id(=ssr-runtime::runtime) | binary_id(=ssr-runtime::snapshot_process) | binary_id(=ssr-server::cancellation) | binary_id(=ssr-server::react_late_reader) | binary_id(=ssr-server::react_stream) | binary_id(=ssr-server::render) | binary_id(=ssr-server::svelte)'
setup = "install-packages"
