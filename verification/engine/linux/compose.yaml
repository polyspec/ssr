name: ${SSR_ENGINE_PROJECT}

services:
  engine:
    image: ${SSR_ENGINE_IMAGE}
    command: ["sleep", "infinity"]
    environment:
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /target
      SSR_V8_DIR: ${SSR_V8_DIR}
      SSR_ORDERED_JSON_DIR: ${SSR_ORDERED_JSON_DIR}
      RUSTY_V8_ARCHIVE: /src/var/v8/librusty_v8_simdutf_release_aarch64-unknown-linux-gnu.a.gz
    volumes:
      - ${SSR_SOURCE_DIR}:/src:ro
      - ${SSR_V8_DIR}:${SSR_V8_DIR}:ro
      - ${SSR_ORDERED_JSON_DIR}:${SSR_ORDERED_JSON_DIR}:ro
      - ${SSR_CARGO_DIR}:/cargo
      - ${SSR_TARGET_DIR}:/target
    cpus: "4"
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "/usr/local/cargo/bin/cargo", "--version"]
      timeout: 10s
      retries: 1
