[package]
name = "polyspec-ssr-server"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
http.workspace = true
polyspec-ssr-build = { path = "../polyspec-ssr-build", version = "=0.0.1" }
polyspec-ssr-core = { path = "../polyspec-ssr-core", version = "=0.0.1" }
polyspec-ssr-runtime = { path = "../polyspec-ssr-runtime", version = "=0.0.1" }
polyspec-ssr-adapter-react = { path = "../polyspec-ssr-adapter-react", version = "=0.0.1" }
polyspec-ssr-adapter-svelte = { path = "../polyspec-ssr-adapter-svelte", version = "=0.0.1" }
polyspec-ssr-adapter-vanilla = { path = "../polyspec-ssr-adapter-vanilla", version = "=0.0.1" }
polyspec-ssr-nonce = { path = "../polyspec-ssr-nonce", version = "=0.0.1" }
sourcemap.workspace = true
tracing.workspace = true
sha2.workspace = true
notify.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
getrandom.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
kqueue.workspace = true
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
sha2.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
tokio.workspace = true
hyper = { workspace = true, features = ["server"] }

[[example]]
name = "development_process"
path = "tests/support/development_process.rs"

[[example]]
name = "socket_process"
path = "tests/support/socket_process.rs"
